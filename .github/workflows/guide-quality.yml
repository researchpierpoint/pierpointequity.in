name: Guide quality
on:
  push:
    paths:
      - "**.html"
      - "assets/**"
      - "scripts/**"
      - "sitemap.xml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize guide experience
        run: python scripts/normalize_guides.py
      - name: Validate guide pages and internal links
        run: python scripts/validate_guides.py
