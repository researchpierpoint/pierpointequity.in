name: PirePoint Data Refresh
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pirepoint-data-refresh, cancel-in-progress: true}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python data/pipeline/nse_universe.py
      - run: python data/pipeline/market_snapshot.py
      - name: Validate
        run: |
          python -m compileall data/pipeline compliance
          python -m unittest discover -s tests -p "test_*.py" -v
          python data/pipeline/validate_pipeline.py
          python - <<'PY'
          import json
          u=json.load(open("data/generated/nse-equity-universe.json")); m=json.load(open("data/generated/nse-market-snapshot.json"))
          assert u["count"]>=1000 and m["count"]>=1000
          PY
      - name: Commit
        run: |
          git config user.name "pirepoint-bot"
          git config user.email "research.pirepoint@gmail.com"
          git add data/generated/nse-equity-universe.json data/generated/nse-market-snapshot.json
          if git diff --cached --quiet; then echo "No generated data change."; else git commit -m "data: refresh public NSE datasets"; git push; fi