name: PirePoint What Changed
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pirepoint-what-changed
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current change feed
        run: python data/pipeline/build_what_changed.py
      - name: Commit
        run: |
          git config user.name "pirepoint-bot"
          git config user.email "research.pirepoint@gmail.com"
          git add data/public/what-changed.json
          if git diff --cached --quiet; then echo "No change-feed update."; else git commit -m "auto: refresh What Changed"; git push; fi
