name: PirePoint Ownership and Filings
on:
 workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ownership-filings, cancel-in-progress: true}
jobs:
 refresh:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Shareholding
     env: {SHAREHOLDING_LIMIT: "300"}
     run: python data/pipeline/nse_shareholding.py
   - name: Announcements
     env: {ANNOUNCEMENT_LIMIT: "300"}
     run: python data/pipeline/nse_announcements.py
   - run: python -m compileall data/pipeline
   - name: Commit
     run: |
       git config user.name "pirepoint-bot"; git config user.email "research.pirepoint@gmail.com"
       git add data/generated/nse-shareholding.json data/generated/nse-announcements.json
       if git diff --cached --quiet; then echo "No filing change."; else git commit -m "data: refresh ownership and corporate filings"; git push; fi