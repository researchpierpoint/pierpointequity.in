name: PirePoint Bootstrap Refresh
on:
  schedule:
    - cron: "31 20 29 9 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pirepoint-auto-maintenance
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install data connector
        run: pip install --disable-pip-version-check -q "jugaad-data==0.35.5"
      - name: Refresh all research layers
        env:
          RESULT_LIMIT: "150"
          INTEGRATED_FINANCIAL_LIMIT: "150"
          XBRL_LIMIT: "30"
          SHAREHOLDING_LIMIT: "100"
          ANNOUNCEMENT_LIMIT: "150"
        run: |
          python data/pipeline/amfi_nav.py
          python data/pipeline/nse_universe.py
          python data/pipeline/market_snapshot.py
          python data/pipeline/nse_financial_results.py
          python data/pipeline/nse_integrated_financials.py
          python data/pipeline/nse_financial_statements.py
          python data/pipeline/nse_shareholding.py
          python data/pipeline/nse_announcements.py
          python data/pipeline/nse_etf_snapshot.py
          python data/pipeline/mf_intelligence.py
          python data/pipeline/historical_valuation.py
          python data/pipeline/build_company_intelligence.py
          python data/pipeline/coverage_audit.py
          python data/pipeline/build_what_changed.py
          python data/pipeline/site_health.py
          python data/pipeline/public_surface_audit.py
          python -m compileall data/pipeline
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Commit generated refresh
        run: |
          git config user.name "pirepoint-bot"
          git config user.email "research.pierpoint@gmail.com"
          git add data/generated/ data/public/what-changed.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "bootstrap: refresh all PirePoint research data"
            git push
          fi
