name: PirePoint Financial Results

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "financial-results"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSE filing connector
        run: pip install --disable-pip-version-check -q "jugaad-data==0.35.5"
      - name: Fetch current NSE integrated financial filings
        env:
          INTEGRATED_FINANCIAL_LIMIT: "500"
        run: python data/pipeline/nse_integrated_financials.py
      - name: Refresh legacy NSE result comparison
        env:
          RESULT_LIMIT: "500"
        run: python data/pipeline/nse_financial_results.py
      - name: Validate snapshots
        run: |
          python -m compileall data/pipeline
          python - <<'PY'
          import json
          for name in ("nse-integrated-financials.json","nse-financial-results.json"):
              d=json.load(open("data/generated/"+name,encoding="utf-8"))
              assert d["coverage"] >= 1
              print(name, "coverage:", d["coverage"])
          PY
      - name: Commit snapshots
        run: |
          git config user.name "pirepoint-bot"
          git config user.email "research.pirepoint@gmail.com"
          git add data/generated/nse-integrated-financials.json data/generated/nse-financial-results.json
          if git diff --cached --quiet; then
            echo "No financial data change."
          else
            git commit -m "data: refresh NSE integrated financial filings"
            git push
          fi
