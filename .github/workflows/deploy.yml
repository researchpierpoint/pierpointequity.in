name: Deploy PirePoint Equity to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify publisher
        run: |
          test "${{ github.actor }}" = "researchpierpoint"
          echo "Publication approved for the PirePoint owner."

  deploy:
    needs: publication-gate:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize guide experience
        run: python scripts/normalize_guides.py
      - name: Build public website
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
