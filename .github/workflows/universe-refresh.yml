name: PirePoint Universe Refresh

on:
  # push refresh is handled by the serialized data-refresh workflow
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: "universe-refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh NSE universe
        run: python data/pipeline/nse_universe.py

      - name: Validate foundation
        run: python data/pipeline/validate_pipeline.py

      - name: Commit changed snapshot
        run: |
          git config user.name "pirepoint-bot"
          git config user.email "research.pirepoint@gmail.com"
          git add data/generated/nse-equity-universe.json
          if git diff --cached --quiet; then
            echo "No universe change."
          else
            git commit -m "data: refresh NSE equity universe"
            git push
          fi
