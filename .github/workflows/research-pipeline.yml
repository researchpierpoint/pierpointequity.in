name: PirePoint Research Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"
permissions: {contents: read}
concurrency: {group: research-pipeline, cancel-in-progress: true}
jobs:
  research-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate research foundation
        run: |
          python -m compileall data/pipeline compliance
          test -f data/schema/company.schema.json
          test -f data/schema/company-page.schema.json
          test -f data/universe/company-master.json
          test -f data/pipeline/universe-rules.json
          test -f monitoring/monitor-policy.json
          python -m unittest discover -s tests -p "test_*.py" -v
          echo "PirePoint research foundation validated."