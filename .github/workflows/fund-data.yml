name: PirePoint Fund Data
on:
  push:
    branches: ["main"]
    paths:
      - "data/pipeline/amfi_nav.py"
      - ".github/workflows/fund-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1-6"
permissions: {contents: write}
concurrency: {group: fund-data, cancel-in-progress: true}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python data/pipeline/amfi_nav.py
      - name: Validate
        run: |
          python -m compileall data/pipeline
          python - <<'PY'
          import json
          d=json.load(open("data/generated/amfi-nav.json")); assert d["count"]>=1000
          print("AMFI validated:",d["count"])
          PY
      - name: Commit
        run: |
          git config user.name "pirepoint-bot"
          git config user.email "research.pirepoint@gmail.com"
          git add data/generated/amfi-nav.json
          if git diff --cached --quiet; then echo "No fund data change."; else git commit -m "data: refresh AMFI fund NAVs"; git push; fi